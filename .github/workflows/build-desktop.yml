name: Build Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "server/**"
      - "web/**"
      - "desktop/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Compilar backend e frontend
        run: npm run build

      - name: Empacotar backend para o Electron
        run: npm run bundle --workspace desktop

      - name: Gerar instalador Windows (.exe)
        run: npm run dist --workspace desktop -- --win --x64

      - name: Publicar .exe como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: Attual-Programa-de-Pedidos-Windows
          path: |
            desktop/release/*.exe
          if-no-files-found: error
