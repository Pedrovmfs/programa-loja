<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Attual - Programa de Pedidos</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f4f5;
        color: #1c1c1e;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #52525b; max-width: 420px; margin: 0 0 20px; }
      button {
        background: #e8590c;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Não foi possível conectar</h1>
    <p>
      Não consegui falar com o computador principal. Verifique se ele está
      ligado, conectado à mesma rede da loja, e se o programa está aberto
      nele — depois clique em tentar novamente.
    </p>
    <button id="retry">Tentar novamente</button>
    <script>
      const params = new URLSearchParams(location.search);
      const target = params.get("target");
      document.getElementById("retry").addEventListener("click", () => {
        location.href = target;
      });
    </script>
  </body>
</html>
